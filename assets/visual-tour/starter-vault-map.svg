<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Starter vault map</title>
  <desc id="desc">A public-safe diagram showing the generic starter vault folders and how project notes connect to templates, runbooks, and decision logs.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .command { fill: #e0f2fe; stroke: #0284c7; }
      .project { fill: #dcfce7; stroke: #16a34a; }
      .template { fill: #fef3c7; stroke: #d97706; }
      .runbook { fill: #ede9fe; stroke: #7c3aed; }
      .decision { fill: #ffe4e6; stroke: #e11d48; }
      .archive { fill: #f1f5f9; stroke: #64748b; }
      .text { font-family: Inter, Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; font-size: 17px; }
      .label { font-size: 21px; font-weight: 700; }
      .small { font-size: 16px; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="540" />
  <text class="text" x="48" y="58" font-size="32" font-weight="800">Starter vault map</text>
  <text class="text muted" x="48" y="88">Sanitized Obsidian layout for project memory, AI collaboration, and publication checks.</text>

  <rect class="panel command" x="60" y="132" width="250" height="92" rx="18" />
  <text class="text label" x="84" y="166">00_Command</text>
  <text class="text small" x="84" y="194">AI Team Room + routing</text>

  <rect class="panel project" x="355" y="122" width="250" height="112" rx="18" />
  <text class="text label" x="379" y="158">10_Projects</text>
  <text class="text small" x="379" y="186">One note per active project</text>
  <text class="text small" x="379" y="210">Goal, scope, next actions</text>

  <rect class="panel template" x="650" y="132" width="250" height="92" rx="18" />
  <text class="text label" x="674" y="166">30_Templates</text>
  <text class="text small" x="674" y="194">Reusable note patterns</text>

  <rect class="panel runbook" x="90" y="320" width="235" height="92" rx="18" />
  <text class="text label" x="114" y="354">40_Runbooks</text>
  <text class="text small" x="114" y="382">Step-by-step checks</text>

  <rect class="panel decision" x="362" y="308" width="235" height="116" rx="18" />
  <text class="text label" x="386" y="342">50_Decisions</text>
  <text class="text small" x="386" y="370">Options, trade-offs,</text>
  <text class="text small" x="386" y="394">revisit triggers</text>

  <rect class="panel archive" x="635" y="320" width="235" height="92" rx="18" />
  <text class="text label" x="659" y="354">90_Archive</text>
  <text class="text small" x="659" y="382">Completed or paused work</text>

  <path class="line" d="M 310 178 C 330 178, 336 178, 355 178" />
  <path class="line" d="M 605 178 C 625 178, 630 178, 650 178" />
  <path class="line" d="M 480 234 C 440 260, 278 290, 208 320" />
  <path class="line" d="M 480 234 C 480 258, 480 278, 480 308" />
  <path class="line" d="M 480 234 C 530 262, 674 290, 752 320" />

  <rect x="60" y="470" width="840" height="36" rx="18" fill="#e2e8f0" />
  <text class="text small" x="84" y="493">Privacy note: all labels are placeholders; no screenshots, real accounts, credentials, or customer data are shown.</text>
</svg>
